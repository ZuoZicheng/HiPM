<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <meta name="description" content="HiPM project introduction video.">
  <link rel="icon" href="data:,">
  <title>HiPM Introduction Video</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: 100%; max-width: 1000px; }
    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #111827;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    @media (max-width: 600px) {
      body { padding: 12px; }
      .video-frame { border-radius: 6px; }
    }
  </style>
</head>
<body>
  <main aria-label="HiPM introduction video">
    <div class="video-frame">
      <video controls playsinline preload="metadata" aria-label="HiPM introduction video">
        <source src="./static/videos/intro.mp4" type="video/mp4">
        Your browser does not support video playback.
      </video>
    </div>
  </main>
</body>
</html>
